# ──────────────────────────────────────────────────────────────────────────────
# verify_config.toml — Expected contract parameters for verification.
#
# Each `[contracts.<name>]` block defines the checks the verify_contract.sh
# script performs.  Values are grouped by network key inside `[network.<label>]`
# so the same config file works for testnet and mainnet.
#
# Fields:
#   wasm_hash    — hex SHA-256 of the WASM blob (set after a known-good build).
#                  Leave empty ("") to skip WASM-hash comparison (you can still
#                  verify source → WASM reproducibility without pinning a hash).
#   contract_id  — on-chain contract ID (C… string).
#   admin        — expected admin Address (G… string).  The script invokes
#                  `admin()` or reads the DataKey::Admin ledger entry.
#   extra_state  — table of additional storage entries to check, keyed by
#                  the storage symbol name.  Value is the expected JSON/XDR.
# ──────────────────────────────────────────────────────────────────────────────

[network.testnet]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"

[network.mainnet]
rpc-url = "https://soroban-mainnet.stellar.org"
network-passphrase = "Public Global Stellar Network ; September 2015"

# ── Network-specific deployments ──────────────────────────────────────────────
#
# Fill in contract IDs, admin addresses, and any extra init-parameter values
# for each network.  Example:
#
#   [contracts.cross_asset_payment.testnet]
#   contract_id = "CCJZ5FPN5F2Y5H3W4X5Y6Z7A8B9C0D1E2F3G4H5I6J7K8L9M0N1O2P3Q4R5"
#   admin = "GBAZ5FPN5F2Y5H3W4X5Y6Z7A8B9C0D1E2F3G4H5I6J7K8L9M0N1O2P3Q4R5"
#
#   [contracts.vesting_escrow.testnet]
#   contract_id = "CDE..."
#   admin = "GABC..."
#   funder = "GABC..."
#   beneficiary = "GABC..."
#   token = "CDEF..."
#   start_time = 1234567890
#   cliff_seconds = 0
#   duration_seconds = 31536000
#   amount = 1000000000
#   clawback_admin = "GABC..."


# ── Contract configurations ───────────────────────────────────────────────────

# Environment-agnostic build + hash comparisons (no network RPC required).
[contracts.bulk_payment]
# SHA-256 of the release-optimized WASM (verify with: stellar contract info hash --wasm target/wasm32-unknown-unknown/release/bulk_payment.wasm)
wasm_hash = "97c4bcd308c8d5904e42e70845ce6c4be75bcfbbf6f6e22af6534a0a58acec32"
[contracts.bulk_payment.params]
init_fn = "initialize"
admin_param = "--admin"
extra_init_args = []

