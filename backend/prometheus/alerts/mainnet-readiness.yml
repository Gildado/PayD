groups:
  - name: payd_mainnet_readiness
    interval: 1m
    rules:
      - alert: PayDPaymentFailureRateHigh
        expr: |
          (
            sum(rate(payment_operations_total{status="failed"}[5m]))
            /
            clamp_min(sum(rate(payment_operations_total{status=~"success|failed"}[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
          service: payments
        annotations:
          summary: "Payment failure rate is above 5%"
          description: "More than 5% of completed payment operations have failed over the last 5 minutes."

      - alert: PayDQueueBacklogHigh
        expr: max(queue_depth) by (queue_name) > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
          service: workers
        annotations:
          summary: "Queue backlog is high for {{ $labels.queue_name }}"
          description: "{{ $labels.queue_name }} has had more than 1000 waiting jobs for 10 minutes."

      - alert: PayDSorobanRpcErrorsHigh
        expr: |
          sum(rate(stellar_api_duration_seconds_count{operation=~"soroban.*|rpc.*",status=~"error|failed|timeout|5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
          service: soroban-rpc
        annotations:
          summary: "Soroban RPC errors are elevated"
          description: "Soroban RPC calls are failing or timing out at more than 0.1 errors per second over 5 minutes."
