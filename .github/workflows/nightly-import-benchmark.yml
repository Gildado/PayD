name: Nightly CSV Import Benchmark

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: 10k-row import budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run 10k-row import benchmark (budgets enforced)
        run: npm run test:benchmark:import
        env:
          BENCHMARK_ARTIFACT_PATH: artifacts/benchmarks/csv-import-10k.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csv-import-benchmark-10k
          path: backend/artifacts/benchmarks/
          if-no-files-found: warn
          retention-days: 30
